[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fog-prediction"
version = "0.1.0"
description = "Subject-independent FoG prediction research pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
train = ["torch>=2.1", "pytorch-lightning>=2.2", "torchmetrics>=1.2", "mlflow", "hydra-core", "omegaconf"]
research = ["scikit-learn", "mne", "statsmodels", "scikit-posthocs", "onnx", "onnxruntime"]
dev = ["pytest>=7", "ruff", "black", "pre-commit"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
